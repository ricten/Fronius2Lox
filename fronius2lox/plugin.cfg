[AUTHOR]
NAME=Rico Tengler
EMAIL=rico@cod-lan.de

[PLUGIN]
VERSION=0.5.0
NAME=fronius2lox
FOLDER=fronius2lox
TITLE=Fronius2Lox
WEBSITE=https://github.com/ricten/Fronius2Lox

[AUTOUPDATE]
# true: neue Installationen bekommen automatische Release-Updates (LoxBerry liest RELEASECFG, Format siehe release.cfg im Repo)
AUTOMATIC_UPDATES=true
RELEASECFG=https://raw.githubusercontent.com/ricten/Fronius2Lox/main/release.cfg
PRERELEASECFG=

[SYSTEM]
REBOOT=false
LB_MINIMUM=4.0.0
LB_MAXIMUM=false
ARCHITECTURE=false
# true: LoxBerry zeigt die Loglevel-Auswahl in der Plugin-Verwaltung (Installer: SYSTEM.CUSTOM_LOGLEVELS)
CUSTOM_LOGLEVELS=true
INTERFACE=2.0
